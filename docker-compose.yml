version: '3.9'

services:
  db:
    image: postgres:16
    container_name: roman-sms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roman
      POSTGRES_PASSWORD: roman
      POSTGRES_DB: romansms
    ports:
      - "5432:5432"
    volumes:
      - roman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roman -d romansms"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  roman_pgdata: