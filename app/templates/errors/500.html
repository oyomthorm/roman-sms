{% extends "base.html" %}
{% block title %}Something went wrong — Roman SMS{% endblock %}
{% block content %}
<div class="text-center py-24">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-100 mb-5">
    <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"/>
    </svg>
  </div>
  <h1 class="text-3xl font-bold tracking-tight text-slate-900">Something went wrong</h1>
  <p class="text-slate-500 mt-2 max-w-md mx-auto">
    We've been notified and are looking into it. Please try again in a moment.
  </p>
  <a href="{{ url_for('landing.index') }}"
     class="inline-flex items-center gap-2 mt-8 bg-slate-900 hover:bg-slate-800
            text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">
    Go to homepage
  </a>
</div>
{% endblock %}
