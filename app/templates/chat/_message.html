<div class="flex items-start gap-3 {% if m.author_id == current_user.id %}flex-row-reverse{% endif %}">

  <div class="w-8 h-8 rounded-full shrink-0 flex items-center justify-center text-xs font-semibold
              {% if m.author.is_master %}bg-slate-900 text-white
              {% else %}bg-emerald-100 text-emerald-700{% endif %}">
    {{ (m.author.full_name or m.author.email)[0]|upper }}
  </div>

  <div class="max-w-[75%] {% if m.author_id == current_user.id %}flex flex-col items-end{% endif %}">
    <div class="text-[11px] text-slate-500 mb-1 {% if m.author_id == current_user.id %}text-right{% endif %}">
      <span class="font-medium text-slate-700">
        {{ m.author.full_name or m.author.email.split('@')[0] }}
      </span>
      {% if m.author.is_master %}
      <span class="text-[10px] px-1 rounded bg-slate-100 text-slate-600">MASTER</span>
      {% endif %}
      <span class="text-slate-400">· {{ m.created_at.strftime('%H:%M') }}</span>
    </div>
    <div class="rounded-2xl px-4 py-2 text-sm whitespace-pre-wrap break-words
                {% if m.author_id == current_user.id %}
                bg-emerald-500 text-white rounded-tr-sm
                {% else %}
                bg-white border border-slate-200 text-slate-800 rounded-tl-sm
                {% endif %}">
      {{ m.body }}
    </div>
  </div>
</div>
