<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset password — Roman SMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">

<div class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">

    <div class="text-center mb-8">
      <a href="{{ url_for('landing.index') }}"
         class="inline-flex items-center gap-2.5 font-bold text-lg tracking-tight">
        <span class="w-9 h-9 rounded-lg bg-emerald-500 text-white
                     flex items-center justify-center text-base font-bold">R</span>
        <span class="text-slate-900">Roman<span class="text-emerald-600">SMS</span></span>
      </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">

      <div class="mb-6">
        <h1 class="text-xl font-bold tracking-tight text-slate-900">Set a new password</h1>
        <p class="text-sm text-slate-500 mt-1">
          Choose something you haven't used before.
        </p>
      </div>

      {% if error %}
      <div class="mb-5 px-4 py-3 rounded-lg border bg-red-50 border-red-200 text-red-800 text-sm">
        {{ error }}
      </div>
      {% endif %}

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="mb-5 px-4 py-3 rounded-lg border text-sm
          {% if cat == 'danger' %}bg-red-50 border-red-200 text-red-800
          {% else %}bg-sky-50 border-sky-200 text-sky-800{% endif %}">
          {{ msg }}
        </div>
        {% endfor %}
      {% endwith %}

      {% if not error %}
      <form method="post" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
          <label for="new_password" class="block text-sm font-medium text-slate-700 mb-1.5">
            New password
          </label>
          <input id="new_password" name="new_password" type="password"
                 required minlength="8" autofocus
                 placeholder="At least 8 characters"
                 class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm
                        placeholder:text-slate-400
                        focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
        </div>
        <div>
          <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1.5">
            Confirm password
          </label>
          <input id="confirm_password" name="confirm_password" type="password"
                 required minlength="8"
                 placeholder="Repeat the same password"
                 class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm
                        placeholder:text-slate-400
                        focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
        </div>
        <button type="submit"
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-semibold
                       py-2.5 rounded-lg transition shadow-sm shadow-emerald-500/20">
          Save new password
        </button>
      </form>
      {% endif %}

      <div class="mt-6 pt-6 border-t border-slate-200 text-center">
        <a href="{{ url_for('auth.login') }}"
           class="text-sm text-slate-500 hover:text-slate-900 transition">← Back to sign in</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
