{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-semibold">Templates</h1>
  <a href="{{ url_for('templates.new') }}"
     class="bg-slate-900 text-white text-sm px-4 py-2 rounded">New template</a>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-slate-100 text-left">
      <tr><th class="p-3">Name</th><th class="p-3">Body</th><th class="p-3"></th></tr>
    </thead>
    <tbody>
      {% for t in templates %}
      <tr class="border-t">
        <td class="p-3">{{ t.name }}</td>
        <td class="p-3 text-slate-600 font-mono text-xs">
          {{ t.body[:100] }}{% if t.body|length > 100 %}…{% endif %}
        </td>
        <td class="p-3 text-right space-x-2">
          <a href="{{ url_for('templates.edit', tid=t.id) }}"
             class="text-sky-700 hover:underline">Edit</a>
          <form method="post" action="{{ url_for('templates.delete', tid=t.id) }}"
                class="inline"
                onsubmit="return confirm('Delete this template?')">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="text-red-700 hover:underline">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="p-6 text-center text-slate-500">
        No templates yet.
      </td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
