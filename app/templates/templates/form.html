{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">
  {{ 'Edit template' if template else 'New template' }}
</h1>

<form method="post" class="bg-white rounded-lg shadow p-6 max-w-2xl space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div>
    <label class="block text-sm mb-1">Name</label>
    <input name="name" required value="{{ template.name if template else '' }}"
           class="w-full border rounded px-3 py-2">
  </div>
  <div>
    <label class="block text-sm mb-1">Body</label>
    <textarea name="body" rows="6" required
              class="w-full border rounded px-3 py-2 font-mono text-sm">{{ template.body if template else '' }}</textarea>
    <p class="text-xs text-slate-500 mt-1">
      Placeholders: <code>{{ '{{name}}' }}</code>, <code>{{ '{{phone}}' }}</code>.
      The brand prefix is added automatically.
    </p>
  </div>
  <button class="bg-slate-900 text-white px-6 py-2 rounded">Save</button>
  <a href="{{ url_for('templates.index') }}"
     class="text-slate-600 ml-2 text-sm">Cancel</a>
</form>
{% endblock %}
